{% extends "base.html" %} {% block title %}Select Term for Attendance Report{%
endblock %} {% block content %}
<div class="max-w-md mx-auto px-4 py-8">
  <!-- Header -->
  <div class="bg-white rounded-xl shadow-md p-6 mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Select Term for Report</h1>
    <p class="text-gray-600">
      Choose the class, term, and year for attendance report
    </p>
  </div>

  <!-- Term Selection Form -->
  <form method="POST" class="bg-white rounded-xl shadow-md p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <!-- Class Selection -->
    <div class="mb-4">
      <label
        for="class_id"
        class="block text-sm font-medium text-gray-700 mb-2"
      >
        Class
      </label>
      <select
        id="class_id"
        name="class_id"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="">Select a Class</option>
        {% for class_ in classes %}
        <option value="{{ class_.id }}">{{ class_.name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Term Selection -->
    <div class="mb-4">
      <label for="term" class="block text-sm font-medium text-gray-700 mb-2">
        Term
      </label>
      <select
        id="term"
        name="term"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="">Select Term</option>
        <option value="Term 1">Term 1</option>
        <option value="Term 2">Term 2</option>
        <option value="Term 3">Term 3</option>
      </select>
    </div>

    <!-- Year Selection -->
    <div class="mb-6">
      <label for="year" class="block text-sm font-medium text-gray-700 mb-2">
        Year
      </label>
      <select
        id="year"
        name="year"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="">Select Year</option>
        {% for year in range(current_year - 2, current_year + 1) %}
        <option value="{{ year }}">{{ year }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end">
      <a
        href="{{ url_for('attendance.attendance_dashboard') }}"
        class="mr-4 inline-flex items-center px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700"
      >
        Cancel
      </a>
      <button
        type="submit"
        class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
      >
        Generate Report
      </button>
    </div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Set default year to current year
    const currentYear = new Date().getFullYear();
    document.getElementById("year").value = currentYear;

    // Set default term based on current month
    const currentMonth = new Date().getMonth() + 1;
    let defaultTerm = "";
    if (currentMonth >= 1 && currentMonth <= 4) defaultTerm = "Term 1";
    else if (currentMonth >= 5 && currentMonth <= 8) defaultTerm = "Term 2";
    else defaultTerm = "Term 3";

    document.getElementById("term").value = defaultTerm;
  });
</script>
{% endblock %}
